# Builds the Windows installers (NSIS .exe + .msi) on every push to main. No secrets needed (unsigned).
name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target
      - run: npm ci
      - run: npm run test:sim
      - run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: wul-ultimate-windows
          path: |
            apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
